spring.application.name=notefrais
server.port=8080

# --- Base de donnees PostgreSQL ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/notefrais}
spring.datasource.username=${DB_USER:notefrais}
spring.datasource.password=${DB_PASSWORD:N0teFr4is_Pr0d!}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql

# --- Secrets applicatifs ---
app.admin.default-password=Admin2024!
app.integration.api-key=nf-live-7c1e9a4b2d6f8e0a3b5c7d9e1f2a4b6c
app.upload-dir=${UPLOAD_DIR:./uploads}
app.report-dir=${REPORT_DIR:./reports}

# --- Session ---
server.servlet.session.cookie.http-only=false
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=7d

# --- Gestion des erreurs ---
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-exception=true

# --- Supervision ---
management.endpoints.web.exposure.include=*
management.endpoint.env.show-values=ALWAYS
management.endpoint.health.show-details=always

# --- Upload ---
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

logging.level.com.formation.notefrais=DEBUG
