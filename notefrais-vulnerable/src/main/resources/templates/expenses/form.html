<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nouvelle note')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main>
    <h1>Nouvelle note de frais</h1>
    <form class="card" method="post" action="/expenses" enctype="multipart/form-data">
        <div class="grid">
            <label>Date <input type="date" name="expenseDate" required></label>
            <label>Catégorie
                <select name="category">
                    <option value="TRANSPORT">Transport</option>
                    <option value="REPAS">Repas (plafond 25 €)</option>
                    <option value="HEBERGEMENT">Hébergement (plafond 120 €)</option>
                    <option value="AUTRE">Autre (plafond 50 €)</option>
                </select>
            </label>
            <label>Montant HT <input type="number" step="0.01" name="amountHt" required></label>
            <label>Taux de TVA (%)
                <select name="vatRate">
                    <option value="20">20</option>
                    <option value="10">10</option>
                    <option value="5.5">5,5</option>
                    <option value="0">0</option>
                </select>
            </label>
            <label>Devise
                <select name="currency">
                    <option>EUR</option><option>USD</option><option>GBP</option><option>CHF</option>
                </select>
            </label>
            <label>Justificatif <input type="file" name="receipt"></label>
        </div>
        <label>Description <textarea name="description" rows="3"></textarea></label>
        <input type="hidden" name="rateUrl" value="http://rates.notefrais.local/api/rate">
        <button type="submit">Soumettre</button>
    </form>
</main>
</body>
</html>
