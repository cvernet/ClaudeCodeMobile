<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Profil')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main>
    <h1>Mon profil</h1>
    <div class="alert info" th:if="${param.saved}">Profil enregistré.</div>
    <form class="card" method="post" action="/profile">
        <label>Identifiant <input th:value="${user.username}" disabled></label>
        <label>Email <input name="email" th:value="${user.email}"></label>
        <label>IBAN (remboursements) <input name="iban" th:value="${user.iban}"></label>
        <label>Signature des notifications <textarea name="signature" rows="3" th:text="${user.signature}"></textarea></label>
        <button type="submit">Enregistrer</button>
    </form>
</main>
</body>
</html>
